---
name: "Feature Request"
description: "Suggest a new feature or enhancement."
title: "[FEATURE] <short description>"
labels: [enhancement]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## Thank you for suggesting a feature!
        Please fill out the information below to help us understand your request.
  - type: input
    id: service
    attributes:
      label: Relevant Service/Component
      description: Which microservice or frontend component is this for?
      placeholder: e.g. product-service, user-service, homestore_react
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: Describe the feature or enhancement you are requesting.
      placeholder: What should it do? Why is it useful?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why do you want this feature? What problem does it solve?
      placeholder: Explain the use case or problem.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternatives?
      placeholder: List any alternative solutions or features.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I have searched existing issues
        - label: I have described the feature clearly
